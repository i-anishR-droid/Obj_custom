<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevRev Object Customization</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-shell" id="app">
    <header class="app-header">
      <div class="app-header-left">
        <div class="app-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12h6M12 9v6"/></svg>
        </div>
        <span class="app-title">DevRev Object Customization</span>
      </div>
      <div class="leaf-type-selector" id="leaf-type-selector" style="display:none;">
        <label class="input-label" style="margin:0;font-size:11px;color:var(--text-muted);">Object Type</label>
        <select class="select" id="leaf-type-select" style="min-width:140px;padding:4px 8px;font-size:12px;">
          <option value="ticket">Ticket</option>
          <option value="issue">Issue</option>
          <option value="conversation">Conversation</option>
        </select>
      </div>
      <div class="app-header-right" id="header-right"></div>
    </header>

    <nav class="tab-bar" id="tab-bar" style="display: none;"></nav>

    <!-- Main / Draft mode switcher -->
    <div class="mode-bar" id="mode-bar" style="display: none;">
      <div class="mode-bar-tabs">
        <button class="mode-tab active" id="mode-main">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          Main
        </button>
        <button class="mode-tab" id="mode-draft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Draft
          <span class="mode-tab-badge" id="draft-count-badge" style="display:none;"></span>
        </button>
      </div>
    </div>

    <main class="app-content" id="content"></main>
    <div class="app-content" id="draft-content" style="display:none;padding:24px;"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
