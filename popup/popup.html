<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 260px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f8f9fb; }
    .title { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .title svg { width: 20px; height: 20px; }
    button { width: 100%; padding: 10px; background: #5e60ce; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #4a4cb0; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="title">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5e60ce" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12h6M12 9v6"/></svg>
    Object Customization
  </div>
  <button id="open-btn">Open Dashboard</button>
  <div class="hint">Opens in a new tab</div>
  <script src="popup.js"></script>
</body>
</html>
